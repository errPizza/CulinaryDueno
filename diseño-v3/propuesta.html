<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culinary Dueño · propuesta v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..750&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef0f3; --card: #ffffff; --tile: #f4f6f8; --line: #e5e8ed; --ink: #151a21; --ink-2: #2b323d; --muted: #6c7581; --faint: #9aa2ad;
  --graphite: #1a1f27; --graphite-2: #252b35; --on-g: #ffffff; --on-g-muted: #9aa3b0; --grid-g: rgba(255,255,255,.07);
  --amber: #f2b33d; --amber-deep: #d99a1c; --amber-ink: #2a1f05; --amber-wash: #fdf3dc;
  --good: #157a3c; --good-bg: #dcf4e3; --bad: #b42a1b; --bad-bg: #fde4e0; --flat: #59626e; --flat-bg: #eceff3;
  --bar: #c9d0d9; --bar-soft: #e8ebef; --red: #e5484d;
  --r: 16px; --r-sm: 11px; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 6px -2px rgba(16,24,40,.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 450 13px/1.45 Inter, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

/* barra lateral */
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 18px 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 14.5px; margin: 2px 4px 18px; }
.brand img { width: 26px; height: 26px; border-radius: 7px; }
.viewing { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 18px; }
.viewing small { display: block; color: var(--muted); font-size: 10.5px; }
.viewing b { font-weight: 600; font-size: 12.5px; }
.chev { color: var(--faint); font-size: 12px; line-height: 1; }
.group { color: var(--muted); font-size: 10.5px; font-weight: 550; margin: 10px 8px 4px; }
.item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 999px; color: var(--ink-2); font-weight: 520; font-size: 12.5px; }
.item svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
.item.on { background: var(--graphite); color: #fff; font-weight: 620; }
.item.on svg { color: var(--amber); }
.item .n { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.side .spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 10px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; font-weight: 700; font-size: 11px; flex: none; }
.me b { display: block; font-size: 12px; font-weight: 620; }
.me small { color: var(--muted); font-size: 10.5px; }

/* encabezado */
main { padding: 18px 26px 32px 6px; min-width: 0; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin: 4px 0 16px; }
.head h1 { font-size: 22px; font-weight: 680; letter-spacing: -.025em; }
.head p { color: var(--muted); margin-top: 2px; font-size: 12.5px; }
.head p b { color: var(--ink); font-weight: 620; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--card); border-radius: 999px; box-shadow: var(--shadow); }
.seg span { height: 28px; padding: 0 12px; display: grid; place-items: center; border-radius: 999px; color: var(--muted); font-size: 11.5px; font-weight: 540; }
.seg span.on { background: var(--graphite); color: #fff; font-weight: 640; }
.round { width: 34px; height: 34px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; }
.round svg { width: 15px; height: 15px; }
.btn { height: 34px; padding: 0 16px; border-radius: 999px; background: var(--amber); color: var(--amber-ink); font-weight: 640; font-size: 12px; display: inline-flex; align-items: center; gap: 7px; }
.btn svg { width: 14px; height: 14px; }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

/* rejillas y tarjetas */
.grid { display: grid; gap: 12px; margin-bottom: 12px; }
.g-hero { grid-template-columns: 1fr 304px; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g21 { grid-template-columns: 2fr 1fr; }
.g12 { grid-template-columns: 1fr 2fr; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.stack { display: grid; gap: 12px; align-content: start; }
.card { background: var(--card); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-h h2 { font-size: 13.5px; font-weight: 640; letter-spacing: -.01em; }
.card-h small { color: var(--muted); font-size: 11px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tiles.t3 { grid-template-columns: repeat(3, 1fr); }
.tiles.t4 { grid-template-columns: repeat(4, 1fr); }
.tile { background: var(--tile); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }
.tile small { display: block; color: var(--muted); font-size: 10.5px; margin-bottom: 4px; }
.tile .v { font-size: 18px; font-weight: 640; letter-spacing: -.02em; }
.tile .v i { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 3px; }
.tile .s { display: flex; align-items: center; gap: 6px; margin-top: 5px; color: var(--muted); font-size: 10.5px; }
.note { display: flex; gap: 7px; align-items: flex-start; margin-top: 10px; color: var(--muted); font-size: 11px; }
.note .ring { flex: none; width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid var(--red); margin-top: 2px; }
.alertbox { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; background: var(--bad-bg); color: var(--bad); border-radius: var(--r-sm); font-size: 11.5px; }
.alertbox b { font-weight: 650; }
.alertbox.amber { background: var(--amber-wash); color: #7a5300; }
.alertbox.green { background: var(--good-bg); color: var(--good); }
.muted { color: var(--muted); }

/* píldoras */
.pill { display: inline-flex; align-items: center; gap: 3px; height: 19px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 620; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.flat { background: var(--flat-bg); color: var(--flat); }
.pill.amber { background: var(--amber-wash); color: #8a5d00; }
.pill.dark { background: rgba(255,255,255,.1); color: #fff; }

/* tarjeta grafito */
.hero { background: radial-gradient(120% 90% at 85% 0%, #2b2a24 0%, var(--graphite) 55%); color: var(--on-g); border-radius: 18px; padding: 16px 18px 14px; min-width: 0; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero .lbl { display: flex; align-items: center; gap: 7px; color: var(--on-g-muted); font-size: 11px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 3px rgba(61,220,132,.18); }
.big { font-size: 40px; font-weight: 720; letter-spacing: -.04em; line-height: 1.1; margin: 6px 0 6px; }
.big small { font-size: 21px; color: var(--on-g-muted); font-weight: 600; letter-spacing: -.02em; }
.hero .sub { color: var(--on-g-muted); font-size: 11.5px; margin-top: 6px; }
.hero .sub b { color: #fff; font-weight: 620; }
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: rgba(255,255,255,.06); border-radius: 999px; }
.tabs span { height: 22px; padding: 0 10px; border-radius: 999px; display: grid; place-items: center; color: var(--on-g-muted); font-size: 10.5px; font-weight: 550; }
.tabs span.on { background: var(--amber); color: var(--amber-ink); font-weight: 650; }
.tabs.light { background: var(--tile); }
.tabs.light span { color: var(--muted); }
.tabs.light span.on { background: var(--graphite); color: #fff; }
.hero-line { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 11.5px; color: var(--on-g-muted); }
.hero-line b { color: #fff; }
.legend { display: inline-flex; gap: 12px; align-items: center; font-size: 10.5px; color: var(--on-g-muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legend i.a { background: var(--amber); }
.legend i.o { border: 1.4px solid var(--on-g-muted); }
.legend.light { color: var(--muted); }
.legend.light i.o { border-color: var(--faint); }
.legend.light i.g { background: var(--bar); }

/* gráfica de barras vertical */
.chart { position: relative; display: grid; grid-template-columns: 58px 1fr; margin-top: 8px; }
.yaxis { position: relative; height: var(--h, 200px); font-size: 9.5px; color: var(--on-g-muted); white-space: nowrap; }
.yaxis span { position: absolute; right: 8px; transform: translateY(50%); }
.plot { position: relative; height: var(--h, 200px); display: flex; align-items: flex-end; gap: var(--gap, 7px); padding: 0 2px; }
.plot .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid-g); }
.col { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.col .was { position: absolute; bottom: 0; left: 0; right: 0; border: 1.3px solid rgba(255,255,255,.22); border-bottom: 0; border-radius: 6px 6px 0 0; }
.col .now { position: relative; width: 100%; background: var(--amber); border-radius: 6px 6px 2px 2px; }
.col .now .part { position: absolute; left: 0; right: 0; bottom: 0; background: #8f6210; border-radius: 0 0 2px 2px; }
.legend i.d { background: #8f6210; }
.col .now.dim { background: rgba(242,179,61,.38); }
.col .now.neutral { background: var(--bar); }
.col.open .now { background: repeating-linear-gradient(135deg, rgba(242,179,61,.95) 0 4px, rgba(242,179,61,.6) 4px 8px); }
.col.ghost::before { content: ''; position: absolute; inset: 0 -3px; background: rgba(255,255,255,.05); border-radius: 8px; }
.col .lab { position: absolute; bottom: calc(100% + 4px); font-size: 9.5px; font-weight: 620; color: var(--ink); white-space: nowrap; }
.xaxis { grid-column: 2; display: flex; gap: var(--gap, 7px); padding: 6px 2px 0; font-size: 9.5px; color: var(--on-g-muted); }
.xaxis span { flex: 1; text-align: center; }
.light-chart .yaxis, .light-chart .xaxis { color: var(--faint); }
.light-chart .plot .gl { border-color: var(--line); }
.light-chart .col .was { border-color: var(--faint); }

/* listas */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: 0; padding-top: 2px; }
.row .nm { font-weight: 600; font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { display: block; color: var(--muted); font-weight: 450; font-size: 10.5px; }
.row .am { text-align: right; font-weight: 640; font-size: 13px; }
.row .am small { display: block; color: var(--muted); font-weight: 450; font-size: 10.5px; }
.track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--bar-soft); overflow: hidden; }
.track span { display: block; height: 100%; border-radius: 3px; background: var(--bar); }
.track span.a { background: var(--amber); }
.track span.r { background: #e48b80; }
.track span.g { background: #6fc28f; }
.stackbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--bar-soft); margin: 2px 0 12px; }
.stackbar span { height: 100%; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.dot.a { background: var(--amber); } .dot.g { background: var(--bar); } .dot.k { background: var(--graphite); } .dot.ok { background: #2fbf71; } .dot.r { background: var(--red); } .dot.s { background: #c2c8d0; }

/* sucursales con su día */
.br { display: grid; grid-template-columns: 150px 1fr 110px; gap: 16px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.br:first-child { border-top: 0; padding-top: 2px; }
.br b { font-size: 12.5px; font-weight: 620; display: block; }
.br small { color: var(--muted); font-size: 10.5px; }
.br small.r { color: var(--bad); }
.dayline { position: relative; }
.dayline .t { position: relative; height: 6px; border-radius: 3px; background: var(--bar-soft); }
.dayline .t span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--amber); }
.dayline .t span.r { background: #e48b80; }
.dayline .t i { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--ink-2); border-radius: 1px; opacity: .55; }
.dayline .h { display: flex; justify-content: space-between; margin-top: 5px; font-size: 9.5px; color: var(--faint); }
.br .am { text-align: right; font-weight: 650; font-size: 13px; }
.br .am .pill { margin-top: 3px; }

/* medidor */
.gauge { position: relative; display: grid; place-items: center; margin: 2px 0 4px; }
.gauge svg { width: 220px; height: 123px; }
.gauge .gv { position: absolute; bottom: 4px; text-align: center; }
.gs { display: block; text-align: center; color: var(--muted); font-size: 10.5px; margin-top: 2px; }
.gauge .gv b { font-size: 24px; font-weight: 720; letter-spacing: -.03em; }
.gauge .gv small { display: block; color: var(--muted); font-size: 10.5px; }
.goal-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }
.goal-foot b { color: var(--ink); font-size: 14px; font-weight: 650; }

/* tablas */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--muted); font-weight: 550; font-size: 10.5px; padding: 0 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; }
td b { font-weight: 620; }
td small { display: block; color: var(--muted); font-size: 10.5px; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }

/* cuadrante de menú */
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.q { border-radius: var(--r-sm); padding: 11px 12px; background: var(--tile); }
.q h3 { font-size: 12px; font-weight: 650; display: flex; justify-content: space-between; }
.q p { color: var(--muted); font-size: 10.5px; margin: 2px 0 7px; }
.q ul { list-style: none; font-size: 11.5px; display: grid; gap: 3px; }
.q li { display: flex; justify-content: space-between; }
.q li span { color: var(--muted); }
.q.star { background: var(--amber-wash); }

/* mapa de calor */
.heat { display: grid; grid-template-columns: 30px repeat(15, 1fr); gap: 3px; font-size: 9.5px; color: var(--muted); }
.heat span { height: 18px; border-radius: 4px; display: grid; place-items: center; font-size: 9.5px; font-weight: 600; color: var(--ink-2); }
.heat .hl { color: var(--faint); font-weight: 500; }

/* cascada */
.fall { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 190px; padding-top: 6px; }
.fall .c { position: relative; height: 100%; }
.fall .c span { position: absolute; left: 0; right: 0; border-radius: 6px; }
.fall .c em { position: absolute; left: 0; right: 0; text-align: center; font-style: normal; font-size: 10.5px; font-weight: 640; color: #fff; }
.fall-x { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 7px; font-size: 10px; color: var(--on-g-muted); text-align: center; }

/* mensajes */
.thread { display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 12px; }
.thread.on { background: var(--tile); }
.thread .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--tile); display: grid; place-items: center; flex: none; }
.thread.on .ic { background: var(--card); }
.thread .ic svg { width: 16px; height: 16px; color: var(--muted); }
.thread .tx { flex: 1; min-width: 0; }
.thread .tx b { display: block; font-size: 12.5px; font-weight: 620; }
.thread .tx small { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread .sd { text-align: right; font-size: 10px; color: var(--faint); display: grid; gap: 4px; justify-items: end; }
.thread .sd .n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.bubbles { display: flex; flex-direction: column; gap: 10px; padding: 6px 0 14px; }
.bub { max-width: 72%; padding: 10px 13px; border-radius: 15px; background: var(--tile); font-size: 12.5px; }
.bub small { display: block; margin-top: 4px; font-size: 10px; color: var(--muted); }
.bub.mine { align-self: flex-end; background: var(--graphite); color: #fff; border-bottom-right-radius: 5px; }
.bub.mine small { color: var(--on-g-muted); }
.bub.them { border-bottom-left-radius: 5px; }
.day-sep { align-self: center; font-size: 10px; color: var(--faint); padding: 2px 10px; background: var(--tile); border-radius: 999px; }
.compose { display: flex; gap: 8px; align-items: flex-end; padding: 10px; background: var(--tile); border-radius: 14px; }
.compose .fake { flex: 1; color: var(--faint); font-size: 12.5px; padding: 6px 4px; min-height: 40px; }
.compose .btn { flex: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { height: 24px; padding: 0 10px; border-radius: 999px; background: var(--tile); font-size: 11px; font-weight: 550; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.chip.on { background: var(--graphite); color: #fff; }

/* ajustes */
.form-row { display: grid; grid-template-columns: 1fr 120px 28px; gap: 8px; align-items: center; margin-bottom: 8px; }
.inp { height: 34px; padding: 0 11px; display: flex; align-items: center; justify-content: space-between; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
.inp.ph { color: var(--faint); }
.lbl2 { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; display: block; }
.x { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); }
.addl { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px dashed var(--bar); color: var(--ink-2); font-size: 11.5px; font-weight: 560; margin-top: 2px; }
.switch { display: inline-block; vertical-align: middle; width: 32px; height: 18px; border-radius: 9px; background: var(--good); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.setline { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
.setline:first-of-type { border-top: 0; }
.setline b { font-size: 12.5px; font-weight: 600; display: block; }
.setline small { color: var(--muted); font-size: 10.5px; }
.slider { width: 160px; height: 6px; border-radius: 3px; background: var(--bar-soft); position: relative; }
.slider span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--amber); }
.slider i { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px var(--amber-deep), 0 1px 3px rgba(0,0,0,.15); margin-left: -8px; }

/* alertas */
.al { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.al:first-child { border-top: 0; padding-top: 2px; }
.al .ai { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.al .ai svg { width: 15px; height: 15px; }
.al .ai.h { background: var(--bad-bg); color: var(--bad); }
.al .ai.m { background: var(--amber-wash); color: #9a6a00; }
.al .ai.i { background: var(--flat-bg); color: var(--flat); }
.al b { font-size: 12.5px; font-weight: 630; }
.al p { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.al .tag { font-size: 10px; color: var(--muted); padding: 2px 8px; background: var(--tile); border-radius: 999px; white-space: nowrap; }
.al .act { margin-top: 7px; display: flex; gap: 6px; }
.al .act span { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--tile); color: var(--ink-2); }

/* rango de pronóstico */
